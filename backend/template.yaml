AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Music Garden backend — Cognito (username+password) auth + per-user progress API on DynamoDB.

# Cost and data limits (TUN-82): the route throttles on the HttpApi events, the reserved concurrency in
# Globals, the MonthlyBudget, and the Retain / deletion-protection / point-in-time-recovery settings on the
# tables and the user pool. backend/README.md § "Limits and budget" explains them and how to change them;
# reviews/TUN-82-throttle-budget-data-protection.md has the cost arithmetic.

Parameters:
  # Never commit the address (the repository is public): pass it once, on the first deploy after TUN-82, with
  #   sam deploy --parameter-overrides BudgetEmail=you@example.com
  # Later `sam deploy`s reuse the stored value. Check samconfig.toml holds no address before committing it.
  # AWS emails the address a verification link; alerts only go out once the budget shows it as Active.
  BudgetEmail:
    Type: String
    NoEcho: true
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    ConstraintDescription: must be an email address
    Description: Where AWS Budgets emails the monthly cost alerts.

Globals:
  Function:
    Runtime: nodejs24.x
    MemorySize: 128
    Timeout: 10
    # A small, fixed slice of the account's Lambda concurrency (1000 on this account; Lambda keeps 100
    # unreserved). Caps each function at 2 calls in flight, whatever reaches it.
    ReservedConcurrentExecutions: 2

Resources:

  # --- Cost alert: $30 a month across the WHOLE AWS account (no cost filters), emailed to BudgetEmail. ---
  # No BudgetName on purpose: changing the notifications (a new BudgetEmail) REPLACES the budget, and
  # CloudFormation creates the new one before deleting the old — a fixed name would collide.
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 30
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

  # --- Auth: a Cognito User Pool. Username + password sign-in; email is OPTIONAL (recovery only). ---
  # Every account lives here: never deleted with the stack, never silently replaced, and protected from
  # deletion by AWS itself (switch DeletionProtection off by hand to really remove it).
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: music-garden-users
      DeletionProtection: ACTIVE
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
      # Forgot-password works only for users who chose to add a (verified) email.
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      # Auto-confirm accounts so there's no email step for the common (no-email) case.
      LambdaConfig:
        PreSignUp: !GetAtt PreSignUpFn.Arn

  # Public browser client (no secret).
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: music-garden-web
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 365
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  # Pre-sign-up trigger: auto-confirm the user (and auto-verify email if one was supplied).
  PreSignUpFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: presignup.handler

  PreSignUpPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PreSignUpFn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  # --- Storage: one tiny item per user (PK = Cognito sub) holding the progress JSON. ---
  # Both tables: kept if the stack is deleted or the table would be replaced, protected from deletion,
  # and backed up continuously (point-in-time recovery, 35 days).
  ProgressTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: music-garden-progress
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  # --- Songs storage (SAVE-SHARE.md P3): one row per shared creation; GSI byOwner lists a user's songs. ---
  SongsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: music-garden-songs
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: songId
          AttributeType: S
        - AttributeName: ownerId
          AttributeType: S
        - AttributeName: updated
          AttributeType: N
      KeySchema:
        - AttributeName: songId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byOwner
          KeySchema:
            - AttributeName: ownerId
              KeyType: HASH
            - AttributeName: updated
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # Songs API. Most routes use the default Cognito authorizer; GET /songs/{id} is public (share-link resolution).
  SongsFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: songs.handler
      Environment:
        Variables:
          SONGS_TABLE: !Ref SongsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SongsTable
      # Route throttles (nominal requests/second, shared by ALL callers; over it → 429). See the note on Api.
      Events:
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /songs
            Method: POST
            RouteSettings:
              ThrottlingRateLimit: 0.25
              ThrottlingBurstLimit: 2
        ListMine:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /songs
            Method: GET
            RouteSettings:
              ThrottlingRateLimit: 0.25
              ThrottlingBurstLimit: 2
        GetOne:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /songs/{id}
            Method: GET
            Auth:
              Authorizer: NONE          # public read so a friend can open a share link without an account
            RouteSettings:              # every opened share link; the one route that needs no account
              ThrottlingRateLimit: 1
              ThrottlingBurstLimit: 5
        Update:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /songs/{id}
            Method: PUT
            RouteSettings:
              ThrottlingRateLimit: 0.25
              ThrottlingBurstLimit: 2
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /songs/{id}
            Method: DELETE
            RouteSettings:
              ThrottlingRateLimit: 0.25
              ThrottlingBurstLimit: 2

  # --- API: GET/PUT /progress, scoped to the caller's own row via the JWT `sub`. ---
  ProgressFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: progress.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref ProgressTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProgressTable
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /progress
            Method: GET
            RouteSettings:              # once per sign-in or page load
              ThrottlingRateLimit: 1
              ThrottlingBurstLimit: 5
        Put:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /progress
            Method: PUT
            RouteSettings:              # the busiest route: every save, 900 ms after the last change
              ThrottlingRateLimit: 2
              ThrottlingBurstLimit: 10

  # HTTP API with a built-in Cognito JWT authorizer (validates the ID token; audience = app client).
  # Throttling: each route has its own limit, shared by every caller; the API's nominal steady-state rate
  # is their SUM — 5 requests/second today (progress 2 + 1, song links 1, the four other song routes 0.25
  # each). AWS applies throttles best-effort: bursts and other factors can briefly exceed them, so this is
  # a target, not a guaranteed ceiling. A route added later without its own RouteSettings gets
  # DefaultRouteSettings. Change a limit in its event's RouteSettings, update the sum above, and redo the
  # arithmetic in the TUN-82 review record. tests/backend-template.test.mjs holds these invariants.
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingRateLimit: 0.25
        ThrottlingBurstLimit: 2
      # Only the production site may call the API from a browser. Adding an origin (a deploy preview, say)
      # is the owner's decision; tests/backend-template.test.mjs holds this list.
      CorsConfiguration:
        AllowOrigins:
          - https://tunegarden.game
          - https://www.tunegarden.game
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
      Auth:
        Authorizers:
          CognitoJwt:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient
        DefaultAuthorizer: CognitoJwt

Outputs:
  Region:
    Description: AWS region the stack is deployed in
    Value: !Ref AWS::Region
  UserPoolId:
    Description: Cognito User Pool ID (public — safe to embed in the client)
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito App Client ID (public — safe to embed in the client)
    Value: !Ref UserPoolClient
  ApiUrl:
    Description: Base URL for the progress API
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com"
