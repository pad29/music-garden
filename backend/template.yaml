AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Music Garden backend — Cognito (username+password) auth + per-user progress API on DynamoDB.

# Cost and data limits (TUN-82): the route throttles on the HttpApi events, the reserved concurrency in
# Globals, the MonthlyBudget, and the Retain / deletion-protection / point-in-time-recovery settings on the
# tables and the user pool. backend/README.md § "Limits and budget" explains them and how to change them;
# reviews/TUN-82-throttle-budget-data-protection.md has the cost arithmetic. Sign-ups go to Cognito, not the
# API: DAILY_SIGNUP_LIMIT on PreSignUpFn caps them (TUN-88, reviews/TUN-88-daily-signup-limit.md).

Parameters:
  # Never commit the address (the repository is public): pass it once, on the first deploy after TUN-82, with
  #   sam deploy --parameter-overrides BudgetEmail=you@example.com
  # Later `sam deploy`s reuse the stored value. Check samconfig.toml holds no address before committing it.
  # AWS emails the address a verification link; alerts only go out once the budget shows it as Active.
  BudgetEmail:
    Type: String
    NoEcho: true
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    ConstraintDescription: must be an email address
    Description: Where AWS Budgets emails the monthly cost alerts.

Globals:
  Function:
    Runtime: nodejs24.x
    MemorySize: 128
    Timeout: 10
    # A small, fixed slice of the account's Lambda concurrency (1000 on this account; Lambda keeps 100
    # unreserved). Caps each function at 2 calls in flight, whatever reaches it.
    ReservedConcurrentExecutions: 2

Resources:

  # --- Cost alert: $30 a month across the WHOLE AWS account (no cost filters), emailed to BudgetEmail. ---
  # No BudgetName on purpose: changing the notifications (a new BudgetEmail) REPLACES the budget, and
  # CloudFormation creates the new one before deleting the old — a fixed name would collide.
  # The budget is created (or replaced) only once the whole path to the cost switch exists: a replacement
  # budget already over $30 notifies on its first evaluation, and that must reach the switch.
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    DependsOn:
      - CloudSwitchAlarmTopicPolicy
      - CloudSwitchAlarmSubscription
      - CloudSwitchAlarmPermission
    Properties:
      Budget:
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 30
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
            - SubscriptionType: SNS     # TUN-87: the cost switch — at $30 actual, cloud features switch off
              Address: !Ref CloudSwitchAlarmTopic
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

  # --- Cost switch (TUN-87): at $30 of actual spend, switch the cloud off; the game plays on as a guest. ---
  # Budgets → CloudSwitchAlarmTopic → CloudSwitchFn, which sets ProgressFn, SongsFn and PreSignUpFn to
  # reserved concurrency 0 (no Lambda, no DynamoDB, no new accounts) and disables Api's default endpoint,
  # then emails CloudSwitchNoticeTopic. Never switches back on by itself. backend/README.md § "The cost
  # switch" is the runbook; reviews/TUN-87-cloud-switch.md the design. Costs nothing while idle.
  CloudSwitchAlarmTopic:
    Type: AWS::SNS::Topic       # unencrypted on purpose: Budgets cannot publish to an encrypted topic
    Properties:
      DisplayName: Tune Garden cost switch

  # Only AWS Budgets, from this account, may publish (AWS's documented policy). The source ARN is the
  # account's budgets, not this budget's: naming the budget would make each depend on the other. The owner's
  # own IAM user can still publish — that is the rehearsal.
  CloudSwitchAlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref CloudSwitchAlarmTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: BudgetsPublish
            Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: SNS:Publish
            Resource: !Ref CloudSwitchAlarmTopic
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
              ArnLike:
                "aws:SourceArn": !Sub "arn:aws:budgets::${AWS::AccountId}:*"

  CloudSwitchAlarmSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref CloudSwitchAlarmTopic
      Protocol: lambda
      Endpoint: !GetAtt CloudSwitchFn.Arn

  CloudSwitchAlarmPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CloudSwitchFn
      Principal: sns.amazonaws.com
      SourceArn: !Ref CloudSwitchAlarmTopic

  # The switch's own email. AWS sends a confirmation link to BudgetEmail on the first deploy: until it is
  # clicked, the switch still acts but no email arrives.
  CloudSwitchNoticeTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Tune Garden
      Subscription:
        - Protocol: email
          Endpoint: !Ref BudgetEmail

  # When the owner last switched the cloud back on. A trip message published before it is that switch-on's
  # past, delivered again, and is ignored. Free (a standard parameter). A deploy leaves its value alone unless
  # this resource itself changes, which resets it to "never" — then an old trip delivered again would act.
  CloudSwitchState:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /music-garden/cloud-switch/on-at
      Type: String
      Value: never
      Description: When the owner last switched the cloud back on (TUN-87). Written by music-garden-cloud-switch.

  # Fixed name, so the runbook's commands need no lookup. Its role may change exactly three functions'
  # concurrency, this one API and its own switch-on time, and publish to its own notice topic — nothing else,
  # and never itself.
  CloudSwitchFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: music-garden-cloud-switch
      CodeUri: src/
      Handler: cloud-switch.handler
      Timeout: 60                       # each step is capped well inside this (cloud-switch-api.mjs)
      ReservedConcurrentExecutions: 1   # one command at a time: an off and an on never interleave
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 21600   # Lambda's longest: a late real trip still lands (CloudSwitchState tells old ones)
        MaximumRetryAttempts: 2
      Environment:
        Variables:
          PROGRESS_FN: !Ref ProgressFn
          SONGS_FN: !Ref SongsFn
          PRESIGNUP_FN: !Ref PreSignUpFn
          API_ID: !Ref Api
          ON_CONCURRENCY: "2"           # = Globals' ReservedConcurrentExecutions (tests hold them equal)
          ALARM_TOPIC_ARN: !Ref CloudSwitchAlarmTopic
          NOTICE_TOPIC_ARN: !Ref CloudSwitchNoticeTopic
          STATE_PARAM: !Ref CloudSwitchState
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - lambda:GetFunctionConcurrency
                - lambda:PutFunctionConcurrency
              Resource:
                - !GetAtt ProgressFn.Arn
                - !GetAtt SongsFn.Arn
                - !GetAtt PreSignUpFn.Arn
            - Effect: Allow
              Action:
                - apigateway:GET
                - apigateway:PATCH
              Resource: !Sub "arn:aws:apigateway:${AWS::Region}::/apis/${Api}"
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref CloudSwitchNoticeTopic
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:PutParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/music-garden/cloud-switch/on-at"

  # --- Auth: a Cognito User Pool. A generated garden name + a four-word passphrase; nothing personal (TUN-93). ---
  # Every account lives here: never deleted with the stack, never silently replaced, and protected from
  # deletion by AWS itself (switch DeletionProtection off by hand to really remove it).
  # NEVER change UsernameConfiguration, UsernameAttributes, AliasAttributes or Schema: Cognito fixes them when
  # the pool is made, so a change fails or needs a new, empty pool (tests/backend-template.test.mjs pins them).
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: music-garden-users
      DeletionProtection: ACTIVE
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
      # No self-service recovery: an account has no email or phone to recover with. The garden card is the
      # recovery (DESIGN.md §11b).
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: admin_only
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      # PreSignUpFn auto-confirms each account (there is no email step) and refuses what an account may not hold.
      LambdaConfig:
        PreSignUp: !GetAtt PreSignUpFn.Arn

  # Public browser client (no secret).
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: music-garden-web
      GenerateSecret: false
      # Left out, these lists mean EVERY standard attribute, so a signed-in page could add an email or a name
      # to its account after sign-up. AWS does not document an empty list as "none", so each names one
      # attribute that holds no text a person typed: a number Cognito never sets for this game (TUN-93).
      ReadAttributes:
        - updated_at
      WriteAttributes:
        - updated_at
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 365
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  # Pre-sign-up trigger: refuse a username that is not a generated garden name, or a sign-up carrying an email,
  # a phone number or a free-text attribute (TUN-93); auto-confirm the user — at most
  # DAILY_SIGNUP_LIMIT public sign-ups counted against each UTC day (TUN-88); past it, and whenever the counter cannot be reached,
  # sign-ups are refused and the game plays on as a guest. backend/README.md § "The daily sign-up limit".
  PreSignUpFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: presignup.handler
      Environment:
        Variables:
          # The deploy setting. Change it here, in tests/backend-template.test.mjs (the approved value), in
          # backend/README.md and in the arithmetic of reviews/TUN-88-daily-signup-limit.md; then deploy.
          DAILY_SIGNUP_LIMIT: "100"
          SIGNUP_COUNT_TABLE: !Ref SignUpCountTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt SignUpCountTable.Arn

  PreSignUpPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PreSignUpFn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  # --- Storage: one tiny item per user (PK = Cognito sub) holding the progress JSON. ---
  # Both tables: kept if the stack is deleted or the table would be replaced, protected from deletion,
  # and backed up continuously (point-in-time recovery, 35 days).
  ProgressTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: music-garden-progress
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  # --- The daily sign-up count (TUN-88): one row per UTC day (`day` = "2026-11-15"), `signups` added to
  # atomically by PreSignUpFn, removed by TTL a few days after `expiresAt`. It holds only the day's count — no Retain,
  # no deletion protection, no backups; it is deleted with the stack. Never delete it by hand: sign-ups fail closed
  # until it is recreated (backend/README.md § The daily sign-up limit). Its own table, so TTL is never
  # switched on for a table that holds players' data.
  SignUpCountTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: music-garden-signup-count
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: day
          AttributeType: S
      KeySchema:
        - AttributeName: day
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # --- Songs storage (SAVE-SHARE.md P3): one row per shared creation; GSI byOwner lists a user's songs. ---
  SongsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: music-garden-songs
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: songId
          AttributeType: S
        - AttributeName: ownerId
          AttributeType: S
        - AttributeName: updated
          AttributeType: N
      KeySchema:
        - AttributeName: songId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byOwner
          KeySchema:
            - AttributeName: ownerId
              KeyType: HASH
            - AttributeName: updated
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # Songs API. Most routes use the default Cognito authorizer; GET /songs/{id} is public (share-link resolution).
  SongsFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: songs.handler
      Environment:
        Variables:
          SONGS_TABLE: !Ref SongsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SongsTable
      # Route throttles (nominal requests/second, shared by ALL callers; over it → 429). See the note on Api.
      Events:
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /songs
            Method: POST
            RouteSettings:
              ThrottlingRateLimit: 0.25
              ThrottlingBurstLimit: 2
        ListMine:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /songs
            Method: GET
            RouteSettings:
              ThrottlingRateLimit: 0.25
              ThrottlingBurstLimit: 2
        GetOne:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /songs/{id}
            Method: GET
            Auth:
              Authorizer: NONE          # public read so a friend can open a share link without an account
            RouteSettings:              # every opened share link; the one route that needs no account
              ThrottlingRateLimit: 1
              ThrottlingBurstLimit: 5
        Update:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /songs/{id}
            Method: PUT
            RouteSettings:
              ThrottlingRateLimit: 0.25
              ThrottlingBurstLimit: 2
        Delete:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /songs/{id}
            Method: DELETE
            RouteSettings:
              ThrottlingRateLimit: 0.25
              ThrottlingBurstLimit: 2

  # --- API: GET/PUT /progress, scoped to the caller's own row via the JWT `sub`. ---
  ProgressFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: progress.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref ProgressTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProgressTable
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /progress
            Method: GET
            RouteSettings:              # once per sign-in or page load
              ThrottlingRateLimit: 1
              ThrottlingBurstLimit: 5
        Put:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /progress
            Method: PUT
            RouteSettings:              # the busiest route: every save, 900 ms after the last change
              ThrottlingRateLimit: 2
              ThrottlingBurstLimit: 10

  # HTTP API with a built-in Cognito JWT authorizer (validates the ID token; audience = app client).
  # Throttling: each route has its own limit, shared by every caller; the API's nominal steady-state rate
  # is their SUM — 5 requests/second today (progress 2 + 1, song links 1, the four other song routes 0.25
  # each). AWS applies throttles best-effort: bursts and other factors can briefly exceed them, so this is
  # a target, not a guaranteed ceiling. A route added later without its own RouteSettings gets
  # DefaultRouteSettings. Change a limit in its event's RouteSettings, update the sum above, and redo the
  # arithmetic in the TUN-82 review record. tests/backend-template.test.mjs holds these invariants.
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingRateLimit: 0.25
        ThrottlingBurstLimit: 2
      # Only the production site may call the API from a browser. Adding an origin (a deploy preview, say)
      # is the owner's decision; tests/backend-template.test.mjs holds this list.
      CorsConfiguration:
        AllowOrigins:
          - https://tunegarden.game
          - https://www.tunegarden.game
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
      Auth:
        Authorizers:
          CognitoJwt:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient
        DefaultAuthorizer: CognitoJwt

Outputs:
  Region:
    Description: AWS region the stack is deployed in
    Value: !Ref AWS::Region
  UserPoolId:
    Description: Cognito User Pool ID (public — safe to embed in the client)
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito App Client ID (public — safe to embed in the client)
    Value: !Ref UserPoolClient
  ApiUrl:
    Description: Base URL for the progress API
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com"
  CloudSwitchAlarmTopicArn:
    Description: Publish any message here to trip the cost switch by hand (the rehearsal)
    Value: !Ref CloudSwitchAlarmTopic
