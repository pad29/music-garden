# Netlify config for Tune Garden (https://tunegarden.game)
# The app is a single static file (index.html). This build copies just that file
# into a clean publish dir, so the docs/ and backend/ are NOT served publicly.
# Connect this repo in Netlify (Add new site -> Import from Git); every push auto-deploys.

[build]
  # Copy the app + the pre-baked narration clips (voice/) into a clean publish dir.
  command = "mkdir -p site && cp index.html site/index.html && cp -r voice site/voice 2>/dev/null || true"
  publish = "site"

# Single-page app: serve index.html for any path (harmless here, future-proof for routes).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
